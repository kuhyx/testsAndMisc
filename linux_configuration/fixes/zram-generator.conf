# zram swap for zram-generator -- installed by fixes/setup_zram.sh.
#
# zram-size is the uncompressed capacity. At ~3:1 zstd a full 32 GiB device
# holds about 11 GiB of RAM. Priority 100 puts it above the disk swapfiles
# (priority -1), which stay as the overflow fallback.
[zram0]
zram-size = 32 * 1024
compression-algorithm = zstd
swap-priority = 100
