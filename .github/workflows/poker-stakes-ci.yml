name: poker-stakes CI

on:
  push:
    branches: [main]
    paths:
      - "poker-stakes/**"
      - ".github/workflows/poker-stakes-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "poker-stakes/**"
      - ".github/workflows/poker-stakes-ci.yml"

defaults:
  run:
    working-directory: poker-stakes

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: poker-stakes/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
