name: Python tests

on:
  push:
    branches: [main]
    paths:
      - "python_pkg/lichess_bot/**"
      - "python_pkg/**"
      - "tests/**"
      - "linux_configuration/scripts/periodic_background/system-maintenance/bin/**"
      - "linux_configuration/tests/**"
      - "requirements.txt"
      - ".github/workflows/python-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "python_pkg/lichess_bot/**"
      - "python_pkg/**"
      - "tests/**"
      - "linux_configuration/scripts/periodic_background/system-maintenance/bin/**"
      - "linux_configuration/tests/**"
      - "requirements.txt"
      - ".github/workflows/python-tests.yml"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          rsvg-convert --version
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pytest with coverage
        run: pytest --cov=python_pkg --cov-branch --cov-report=term-missing --cov-fail-under=100
