name: reverse-survivors CI

# Relocated here from reverse_survivors/.github/workflows/ci.yml when the game
# moved into this monorepo — GitHub only reads workflows from the repository
# root, so the nested copy would have been inert.

on:
  push:
    branches: [main]
    paths:
      - "reverse_survivors/**"
      - ".github/workflows/reverse-survivors-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "reverse_survivors/**"
      - ".github/workflows/reverse-survivors-ci.yml"

defaults:
  run:
    working-directory: reverse_survivors

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: reverse_survivors/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
