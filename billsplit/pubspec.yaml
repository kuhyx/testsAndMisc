name: billsplit
description: Receipt bill-splitting with people, groups, per-item assignment and xlsx export.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  excel: ^4.0.6
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  path_provider: ^2.1.4
  provider: ^6.1.2

dev_dependencies:
  file_selector_platform_interface: ^2.7.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true

# Launcher icon generation. Source art is produced by the shared generator:
#   PYTHONPATH=~/testsAndMisc python3 -m python_pkg.app_icons generate --app billsplit
# then run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#211D1B"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
  min_sdk_android: 21
